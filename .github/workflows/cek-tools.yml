
name: Siapkan Android Tools

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - name: Install Java dan Apktool
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk apktool

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Build Tools
        run: |
          sdkmanager "build-tools;35.0.0"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Periksa semua alat
        run: |
          java -version
          apktool --version
          aapt version
          apksigner version
