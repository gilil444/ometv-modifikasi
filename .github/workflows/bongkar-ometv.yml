
name: Bongkar APK OmeTV

on:
  workflow_dispatch:

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo "$GITHUB_REPOSITORY" \
            --pattern "omegle.tv.apk" --dir .

      - name: Pasang Apktool
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool

      - name: Bongkar APK
        run: |
          apktool d omegle.tv.apk -o ome-decode --force

      - name: Simpan hasil ekstraksi
        uses: actions/upload-artifact@v4
        with:
          name: hasil-ekstrak-ometv
          path: ome-decode/
